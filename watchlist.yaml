# Watchlist do screener (R1).
# Campos por ticker:
#   symbol       (obrigatório) ticker yfinance — B3 usa sufixo .SA
#   market       (obrigatório) b3 | us
#   benchmark    (opcional)    índice de referência; default por mercado
#   invalidation (opcional)    { price: <float>, direction: below|above }
#                              nível que, se o FECHAMENTO SEMANAL violar, diz que
#                              a leitura do papel está errada. Não é stop: stop é
#                              gestão de posição, isto é gestão de tese.
#                              below = tese de acumulação (invalida caindo)
#                              above = tese de distribuição (invalida subindo)
#   range        (opcional)    { support: <float>, resistance: <float> } — prevalece sobre o detectado
#   notes        (opcional)    texto livre
#   calendar     (opcional)    lista de { date: AAAA-MM-DD, label: <texto> }

defaults:
  benchmark:
    b3: ^BVSP
    us: ^GSPC

tickers:

# Universos de varredura do screener (R12).
#
# `b3_completa` é a varredura ampla: TODAS as ações do mercado à vista da B3 que
# a listagem da brapi.dev trazia em 13/09/2026 (371 papéis), filtradas por
# padrão de código — ON/PN/PNA/PNB/PNC/PND/UNIT. Ficaram de fora o mercado
# fracionário (…F, que é o mesmo papel em lote ímpar), direitos e recibos de
# subscrição, BDRs e fundos. Não é lista curada: entra papel ilíquido, e é por
# isso que `screener.min_weekly_volume_brl` existe.
#
# `b3_liquidas` é a lista curta e conferida papel a papel — boa para uma
# varredura rápida.
#
# ATENÇÃO: nenhuma delas é a carteira teórica do IBOV. A composição oficial sai
# na B3 (b3.com.br -> Índices -> IBOV -> Composição da carteira).
#
# Ticker de B3 morre: fusão, migração de bolsa, mudança de código. Em 07/09/2026
# dez dos setenta nomes da primeira versão desta lista já não respondiam — entre
# eles EMBR3, que a própria spec §8 registra como tendo virado EMBJ3 em 2025.
# `wyckoff universe --check` refaz essa conferência quando você quiser.
#
# `us_completa` é a varredura ampla dos EUA: a união do S&P 500 com o Nasdaq-100
# (Wikipédia, 14/09/2026) — 503 + 102 símbolos que dão 518 depois de tirar a
# sobreposição. Os 15 que só o Nasdaq-100 traz são, na maioria, empresa
# estrangeira ou sem sede nos EUA, que o S&P 500 não aceita: ASML, ARM, SHOP,
# MELI, PDD, FER, CCEP, TRI. Símbolo de classe usa hífen no yfinance (BRK-B,
# BF-B), não ponto. Os 518 foram conferidos contra o Yahoo em 14/09/2026 e
# todos responderam.
#
# `us_large` é a lista curta de 31 nomes — varredura rápida, não é índice.
#
# Estrutura de cada universo:
#   market     b3 | us          (o mesmo para todos os papéis do bloco)
#   benchmark  índice de referência da força relativa
#   tickers    símbolos no formato do yfinance


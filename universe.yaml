# Universos de varredura do screener (R12).
#
# ATENÇÃO: esta NÃO é a carteira teórica oficial do IBOV. É uma lista inicial de
# papéis líquidos da B3 para o screener ter o que varrer no primeiro dia. A
# composição oficial muda a cada quadrimestre e sai na B3
# (b3.com.br -> Índices -> IBOV -> Composição da carteira); mantenha esta lista
# você mesmo, ou aponte `--universe-file` para outro arquivo.
#
# Ticker de B3 morre: fusão, migração de bolsa, mudança de código. Em 07/09/2026
# dez dos setenta nomes da primeira versão desta lista já não respondiam — entre
# eles EMBR3, que a própria spec §8 registra como tendo virado EMBJ3 em 2025.
# Foram trocados por papéis conferidos um a um contra a fonte (não por sucessão
# societária presumida: são só tickers líquidos que responderam).
# `wyckoff universe --check` refaz essa conferência quando você quiser.
#
# Estrutura de cada universo:
#   market     b3 | us          (o mesmo para todos os papéis do bloco)
#   benchmark  índice de referência da força relativa
#   tickers    símbolos no formato do yfinance


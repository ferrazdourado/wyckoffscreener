# Rotina semanal (sábado de manhã), na nuvem.
#
# Por que existe: `wyckoff report --screen --pdf` é um job em lote de ~9 min por
# semana, não um serviço. O cron do GitHub Actions cobre isso sem custo (repo
# público: ilimitado; privado: ~40 min/mês dos 2.000 do tier gratuito).
#
# O que precisa estar configurado em Settings → Secrets and variables → Actions:
#   WYCKOFF_TELEGRAM_TOKEN    obrigatório p/ o --notify (R9)
#   WYCKOFF_TELEGRAM_CHAT_ID  idem
#   WYCKOFF_BRAPI_TOKEN       opcional, fonte alternativa da B3 (P2)
# Sem os dois primeiros o relatório é gerado assim mesmo; só o envio falha.

name: Relatório semanal

on:
  schedule:
    # Sábado 11:45 UTC = 8:45 BRT (o Brasil não tem mais horário de verão).
    # Pedido de 18/09/2026: o resumo chega no sábado às 9h, e o job leva ~10 min
    # entre instalar, coletar os ~900 papéis e gerar o PDF. O cron do GitHub
    # pode atrasar alguns minutos em horário carregado; nunca adianta.
    # No sábado os dois mercados já fecharam a semana, com folga de sobra para
    # o Yahoo consolidar o candle.
    - cron: "45 11 * * 6"
  workflow_dispatch:
    inputs:
      screen:
        description: "Garimpar candidatos novos (--screen)"
        type: boolean
        default: true
      notify:
        description: "Mandar o resumo pelo Telegram (--notify)"
        type: boolean
        default: true
      pdf:
        description: "Exportar o PDF e anexá-lo à notificação (--pdf)"
        type: boolean
        default: true

# Duas execuções simultâneas brigariam pelo mesmo SQLite.
concurrency:
  group: relatorio-semanal
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e .

      # O cache guarda o SQLite entre as semanas. Ele NÃO torna a coleta
      # incremental: toda semana as 120 semanas de cada papel são rebaixadas
      # inteiras, porque com `auto_adjust=True` um provento reescreve a série
      # toda e baixar só a ponta misturaria bases de ajuste. O que o cache
      # entrega é outra coisa: o relatório ainda tem história quando a coleta
      # falha, e reler no mesmo dia não vai à rede.
      # A chave muda toda semana (senão o cache nunca é regravado); o
      # restore-keys pega o da semana anterior como ponto de partida. Se o cache
      # sumir (7 dias sem uso, ou 10 GB no repo), nada quebra — a coleta já
      # rebaixa tudo de qualquer jeito.
      - name: Data de hoje (chave do cache)
        id: semana
        run: echo "tag=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restaurar o cache de cotações
        uses: actions/cache@v4
        with:
          path: data/wyckoff.sqlite
          key: wyckoff-sqlite-${{ steps.semana.outputs.tag }}
          restore-keys: wyckoff-sqlite-

      - name: Gerar o relatório
        env:
          WYCKOFF_TELEGRAM_TOKEN: ${{ secrets.WYCKOFF_TELEGRAM_TOKEN }}
          WYCKOFF_TELEGRAM_CHAT_ID: ${{ secrets.WYCKOFF_TELEGRAM_CHAT_ID }}
          WYCKOFF_BRAPI_TOKEN: ${{ secrets.WYCKOFF_BRAPI_TOKEN }}
        run: |
          args=""
          # No cron os inputs vêm vazios; só o disparo manual pode desligar cada um.
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.screen }}" = "true" ]; then args="$args --screen"; fi
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.notify }}" = "true" ]; then args="$args --notify"; fi
          # O Chrome já vem instalado no ubuntu-latest, em /usr/bin/google-chrome,
          # que é o primeiro caminho que o pdf.py procura. Com notify.attach_pdf
          # ligado, o PDF gerado aqui vai junto do resumo no Telegram.
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.pdf }}" = "true" ]; then args="$args --pdf"; fi
          wyckoff report $args

      # reports/ está no .gitignore, então o relatório sai como artifact em vez
      # de commit: baixa em Actions → o run → Artifacts.
      - name: Publicar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ steps.semana.outputs.tag }}
          path: |
            reports/
            exports/
          if-no-files-found: warn
          retention-days: 90

      # Os alertas de invalidação e os eventos da semana ficam visíveis na
      # própria página do run, sem precisar baixar nada.
      - name: Resumo na página do run
        if: always()
        run: |
          arquivo=$(ls -t reports/*.md 2>/dev/null | head -1)
          if [ -n "$arquivo" ]; then
            head -60 "$arquivo" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhum relatório gerado." >> "$GITHUB_STEP_SUMMARY"
          fi
